# =============================================================================
# PR Checks — runs on every pull request targeting main
# =============================================================================
# A pull request CANNOT be merged until ALL of these pass:
#   1. Tests pass
#   2. SonarCloud scan passes (code quality + security)
#   3. Docker image builds successfully
#   4. Trivy finds NO critical or high vulnerabilities
#   5. At least 1 reviewer has approved (set in branch protection rules)
#
# NOTE: All application code lives inside the gist-api/ subfolder.
# Every step that touches code, tests, or Docker must reference that path.
# =============================================================================

name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]


jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 — Run Tests
  # Runs first. If tests fail there is no point running anything else.
  # ---------------------------------------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements.txt lives inside gist-api/
      - name: Install dependencies
        run: |
          cd gist-api
          pip install -r requirements.txt

      # tests live in gist-api/test/
      # coverage.xml is generated here and read by SonarCloud in the next job
      - name: Run tests with coverage
        run: |
          cd gist-api
          pytest test/ -v --cov=app --cov-report=xml:coverage.xml


  # ---------------------------------------------------------------------------
  # JOB 2 — SonarCloud Scan
  # Analyses source code for security vulnerabilities and code quality issues.
  # Needs test to pass first so coverage data exists.
  # ---------------------------------------------------------------------------
  sonarcloud-scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd gist-api
          pip install -r requirements.txt

      # Regenerate coverage.xml in this job's workspace.
      # Each job runs on a fresh VM so files from the test job don't carry over.
      - name: Run tests with coverage
        run: |
          cd gist-api
          pytest test/ -v --cov=app --cov-report=xml:coverage.xml

      # sonarcloud-github-action was deprecated Oct 2025.
      # Replacement: sonarqube-scan-action — handles both SonarQube Server and Cloud.
      # SONAR_HOST_URL targets SonarCloud specifically.
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432
        with:
          projectBaseDir: gist-api
          args: >
            -Dsonar.qualitygate.wait=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ---------------------------------------------------------------------------
  # JOB 3 — Build Docker Image and Trivy Security Scan
  #
  # Builds the Docker image then scans it for vulnerabilities.
  # Posts results directly as a PR comment — vulnerabilities block the merge.
  # ---------------------------------------------------------------------------
  build-and-trivy-scan:
    name: Build and Trivy Scan
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Dockerfile lives inside gist-api/ — build context is ./gist-api
      - name: Build Docker image
        run: |
          docker build \
            -t gist-api:pr-${{ github.event.pull_request.number }} \
            ./gist-api

      - name: Run Trivy scan (JSON)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: image
          image-ref: gist-api:pr-${{ github.event.pull_request.number }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          exit-code: 0

      # Print vulnerabilities directly in the workflow log as a table.
      # This means engineers can see findings without leaving the Actions tab.
      # exit-code: 0 so the pipeline continues to the PR comment step below.
      - name: Print Trivy results to workflow log
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: image
          image-ref: gist-api:pr-${{ github.event.pull_request.number }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Run Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: image
          image-ref: gist-api:pr-${{ github.event.pull_request.number }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@d77b13a0df3134d64a457ea9003f600b09fa1c8a
        with:
          sarif_file: trivy-results.sarif

      - name: Post Trivy results as PR comment
        uses: actions/github-script@v7
        id: trivy-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('trivy-results.json', 'utf8');
            const results = JSON.parse(raw);

            const vulns = [];
            for (const result of (results.Results || [])) {
              for (const v of (result.Vulnerabilities || [])) {
                vulns.push({
                  id:        v.VulnerabilityID,
                  pkg:       v.PkgName,
                  installed: v.InstalledVersion,
                  fixed:     v.FixedVersion || 'No fix available',
                  severity:  v.Severity,
                  title:     v.Title || 'No title',
                });
              }
            }

            let body;

            if (vulns.length === 0) {
              body = [
                '## ✅ Trivy Security Scan — No Vulnerabilities Found',
                '',
                'The Docker image was scanned for CRITICAL and HIGH vulnerabilities.',
                'No issues were found. This check has passed.',
              ].join('\n');
            } else {
              const rows = vulns.map(v =>
                `| \`${v.id}\` | ${v.pkg} | ${v.installed} | ${v.fixed} | **${v.severity}** | ${v.title} |`
              ).join('\n');

              body = [
                '## ❌ Trivy Security Scan — Vulnerabilities Found',
                '',
                `**${vulns.length} CRITICAL/HIGH vulnerabilit${vulns.length === 1 ? 'y' : 'ies'} found.**`,
                'This PR cannot be merged until all issues below are resolved.',
                '',
                '| CVE ID | Package | Installed | Fixed In | Severity | Description |',
                '|--------|---------|-----------|----------|----------|-------------|',
                rows,
                '',
                '### How to fix',
                '1. Update the affected packages in `gist-api/requirements.txt` to the fixed versions above',
                '2. Push a new commit to this PR — the scan will re-run automatically',
                '3. If no fix is available, raise it with the team before proceeding',
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body:         body,
            });

            core.setOutput('has_vulns', vulns.length > 0 ? 'true' : 'false');

      - name: Fail if vulnerabilities found
        if: steps.trivy-comment.outputs.has_vulns == 'true'
        run: |
          echo "============================================"
          echo "TRIVY: Vulnerabilities found — merge blocked"
          echo "============================================"
          echo ""
          echo "Full table printed above in the"
          echo "'Print Trivy results to workflow log' step."
          echo ""
          echo "Full list also posted as a comment on this PR."
          echo "Fix the issues and push a new commit to re-run the scan."
          exit 1