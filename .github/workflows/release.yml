# =============================================================================
# Release — runs when a PR is merged into main
# =============================================================================
# Flow after merge:
#   PR merged → build-and-push → image pushed to DockerHub with datetime tag
#   → open-gitops-pr → checks out gist-api-gitops, updates helm/gist-api/values-dev.yaml
#     with the new image tag, and opens a PR
#   → PR merged on gitops → ArgoCD syncs the dev environment automatically
#   → staging and production promoted manually via workflow_dispatch on gitops
#
# REQUIRED SECRETS (GitHub → Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME — DockerHub username (devopsinfra56)
#   DOCKERHUB_TOKEN    — DockerHub access token
#   GITOPS_PAT         — GitHub PAT with repo and pull-request write access
#                        to gist-api-gitops. GITHUB_TOKEN cannot act on a
#                        different repository.
# =============================================================================

name: Release

on:
  push:
    branches: [main]


jobs:

  build-and-push:
    name: Build and Push to DockerHub
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    # Expose IMAGE_TAG so the open-gitops-pr job can consume it.
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Log in to DockerHub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Generate UTC datetime tag: YYYYMMDD-HHMM
      # Written to $GITHUB_ENV (for steps in this job)
      # and $GITHUB_OUTPUT (so open-gitops-pr can consume it via job outputs).
      - name: Generate datetime tag
        id: tag
        run: |
          TAG=$(date -u +'%Y%m%d-%H%M')
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            --tag $DOCKERHUB_USERNAME/gist-api:latest \
            --tag $DOCKERHUB_USERNAME/gist-api:${{ env.IMAGE_TAG }} \
            ./gist-api

      - name: Push to DockerHub
        run: |
          docker push $DOCKERHUB_USERNAME/gist-api:latest
          docker push $DOCKERHUB_USERNAME/gist-api:${{ env.IMAGE_TAG }}

      - name: Print image summary
        run: |
          echo "Image: $DOCKERHUB_USERNAME/gist-api"
          echo "Tags pushed: :latest, :${{ env.IMAGE_TAG }}"


  open-gitops-pr:
    name: Open GitOps PR
    runs-on: ubuntu-latest
    needs: build-and-push

    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      GITOPS_REPO: devopsinfra56/gist-api-gitops

    steps:
      - name: Checkout gist-api-gitops
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}

      # Update the tag field in all environment values files.
      # Matches:  tag: "20260603-0930"
      # Produces: tag: "20260604-0912"
      - name: Update image tag in all environments
        run: |
          for VALUES_FILE in \
            helm/gist-api/values-dev.yaml \
            helm/gist-api/values-staging.yaml \
            helm/gist-api/values-production.yaml; do
            sed -i 's|tag: ".*"|tag: "${{ env.IMAGE_TAG }}"|' $VALUES_FILE
          done

      - name: Commit and push branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b deploy/all-${{ env.IMAGE_TAG }}
          git add \
            helm/gist-api/values-dev.yaml \
            helm/gist-api/values-staging.yaml \
            helm/gist-api/values-production.yaml
          git commit -m "deploy(all): update gist-api image to ${{ env.IMAGE_TAG }}"
          git push origin deploy/all-${{ env.IMAGE_TAG }}

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          gh pr create \
            --repo $GITOPS_REPO \
            --base main \
            --head deploy/all-${{ env.IMAGE_TAG }} \
            --title "deploy(all): update gist-api image to ${{ env.IMAGE_TAG }}" \
            --body "$(cat <<'EOF'
          ## Image Update

          | Field | Value |
          |---|---|
          | **Environments** | \`dev\`, \`staging\`, \`production\` |
          | **Image** | \`devopsinfra56/gist-api:${{ env.IMAGE_TAG }}\` |

          ### Files updated
          - \`helm/gist-api/values-dev.yaml\`
          - \`helm/gist-api/values-staging.yaml\`
          - \`helm/gist-api/values-production.yaml\`

          Merging this PR will trigger ArgoCD to sync all environments.
          EOF
          )"
