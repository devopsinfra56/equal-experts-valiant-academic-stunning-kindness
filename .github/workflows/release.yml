# =============================================================================
# Release — runs when a PR is merged into main
# =============================================================================
# Flow after merge:
#   PR merged → build-and-push → image pushed to DockerHub with datetime tag
#   → deploy-dev-staging → PR opened on gist-api-gitops for dev + staging
#   → approve-production → manual approval required in the GitHub Actions UI
#   → deploy-production → PR opened on gist-api-gitops for production only
#
# REQUIRED SECRETS (GitHub → Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME — DockerHub username (devopsinfra56)
#   DOCKERHUB_TOKEN    — DockerHub access token
#   GITOPS_PAT         — GitHub PAT with repo and pull-request write access
#                        to gist-api-gitops. GITHUB_TOKEN cannot act on a
#                        different repository.
#
# REQUIRED ENVIRONMENT (GitHub → Settings → Environments):
#   production — add required reviewers here. The approve-production job
#                pauses and shows an approval button in the Actions UI until
#                a reviewer approves or rejects.
# =============================================================================

name: Release

on:
  push:
    branches: [main]


jobs:

  build-and-push:
    name: Build and Push to DockerHub
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Log in to DockerHub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate datetime tag
        id: tag
        run: |
          TAG=$(date -u +'%Y%m%d-%H%M')
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            --tag $DOCKERHUB_USERNAME/gist-api:latest \
            --tag $DOCKERHUB_USERNAME/gist-api:${{ env.IMAGE_TAG }} \
            ./gist-api

      - name: Push to DockerHub
        run: |
          docker push $DOCKERHUB_USERNAME/gist-api:latest
          docker push $DOCKERHUB_USERNAME/gist-api:${{ env.IMAGE_TAG }}

      - name: Print image summary
        run: |
          echo "Image: $DOCKERHUB_USERNAME/gist-api"
          echo "Tags pushed: :latest, :${{ env.IMAGE_TAG }}"


  deploy-dev-staging:
    name: Deploy to Dev and Staging
    runs-on: ubuntu-latest
    needs: build-and-push

    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      GITOPS_REPO: devopsinfra56/gist-api-gitops

    steps:
      - name: Checkout gist-api-gitops
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}

      - name: Update image tag for dev and staging
        run: |
          for VALUES_FILE in \
            helm/gist-api/values-dev.yaml \
            helm/gist-api/values-staging.yaml; do
            sed -i 's|tag: ".*"|tag: "${{ env.IMAGE_TAG }}"|' $VALUES_FILE
          done

      - name: Commit and push branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b deploy/dev-staging-${{ env.IMAGE_TAG }}
          git add \
            helm/gist-api/values-dev.yaml \
            helm/gist-api/values-staging.yaml
          git commit -m "deploy(dev+staging): update gist-api image to ${{ env.IMAGE_TAG }}"
          git push origin deploy/dev-staging-${{ env.IMAGE_TAG }}

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          gh pr create \
            --repo $GITOPS_REPO \
            --base main \
            --head deploy/dev-staging-${{ env.IMAGE_TAG }} \
            --title "deploy(dev+staging): update gist-api image to ${{ env.IMAGE_TAG }}" \
            --body "$(cat <<'EOF'
          ## Image Update — Dev and Staging

          | Field | Value |
          |---|---|
          | **Environments** | \`dev\`, \`staging\` |
          | **Image** | \`devopsinfra56/gist-api:${{ env.IMAGE_TAG }}\` |

          ### Files updated
          - \`helm/gist-api/values-dev.yaml\`
          - \`helm/gist-api/values-staging.yaml\`

          Merging this PR will trigger ArgoCD to sync dev and staging.
          Production requires a separate approval in the GitHub Actions UI.
          EOF
          )"


  approve-production:
    name: Approve Production Deployment
    runs-on: ubuntu-latest
    needs: deploy-dev-staging
    # Pauses here and shows an approval button in the GitHub Actions UI.
    # Configure required reviewers under:
    # GitHub → Settings → Environments → production → Required reviewers
    environment: production

    steps:
      - name: Approval granted
        run: echo "Production deployment approved — opening gitops PR."


  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, approve-production]

    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      GITOPS_REPO: devopsinfra56/gist-api-gitops

    steps:
      - name: Checkout gist-api-gitops
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}

      - name: Update image tag for production
        run: |
          sed -i 's|tag: ".*"|tag: "${{ env.IMAGE_TAG }}"|' \
            helm/gist-api/values-production.yaml

      - name: Commit and push branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b deploy/production-${{ env.IMAGE_TAG }}
          git add helm/gist-api/values-production.yaml
          git commit -m "deploy(production): update gist-api image to ${{ env.IMAGE_TAG }}"
          git push origin deploy/production-${{ env.IMAGE_TAG }}

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          gh pr create \
            --repo $GITOPS_REPO \
            --base main \
            --head deploy/production-${{ env.IMAGE_TAG }} \
            --title "deploy(production): update gist-api image to ${{ env.IMAGE_TAG }}" \
            --body "$(cat <<'EOF'
          ## Image Update — Production

          | Field | Value |
          |---|---|
          | **Environment** | \`production\` |
          | **Image** | \`devopsinfra56/gist-api:${{ env.IMAGE_TAG }}\` |

          ### Files updated
          - \`helm/gist-api/values-production.yaml\`

          This PR was opened after manual approval in the GitHub Actions UI.
          Merging will trigger ArgoCD to sync production.
          EOF
          )"
