# Your SonarCloud organisation key
sonar.organization=devopsinfra56

# Your SonarCloud project key
sonar.projectKey=devopsinfra56_equal-experts-valiant-academic-stunning-kindness

sonar.projectName=GitHub Gists API

# Source code location (relative to this file)
sonar.sources=app

# Test code location
sonar.tests=test

# Coverage report generated by pytest --cov in the pipeline
sonar.python.coverage.reportPaths=coverage.xml

# Python version
sonar.python.version=3.12

# Exclude compiled files and virtual environment from analysis
sonar.exclusions=**/__pycache__/**,**/venv/**,**/*.pycs

# SonarCloud URL
sonar.host.url=https://sonarcloud.io

